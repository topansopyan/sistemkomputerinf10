    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- DATA LATIHAN SOAL (10 SOAL ALIGNED TP MODUL) ---
        const quizData = [
            {
                id: 1,
                question: "Ketika Anda mengetik dokumen pada Microsoft Word, karakter teks yang diketik disimpan sementara di memori terluar sebelum diproses. Bagian CPU manakah yang bertanggung jawab melakukan perhitungan aritmatika dan logika saat mengolah data tersebut?",
                options: [
                    "Control Unit (CU)",
                    "Arithmetic Logic Unit (ALU)",
                    "Register",
                    "Read Only Memory (ROM)",
                    "Hard Disk Drive (HDD)"
                ],
                answer: 1,
                explanation: "ALU (Arithmetic Logic Unit) adalah bagian internal CPU yang bertugas melakukan operasi aritmatika (penjumlahan, pengurangan) dan logika (perbandingan AND, OR, dll). Sedangkan CU mengatur lalu lintas instruksi."
            },
            {
                id: 2,
                question: "Sebuah laptop mengalami masalah di mana aplikasi sering 'Not Responding' ketika membuka banyak tab browser sekaligus. Setelah dicek di Task Manager, penggunaan komponen ini mencapai 98%, sementara CPU hanya 20%. Komponen apa yang perlu di-upgrade?",
                options: [
                    "Processor (CPU)",
                    "Random Access Memory (RAM)",
                    "Power Supply Unit (PSU)",
                    "Read Only Memory (ROM)",
                    "VGA Card (GPU)"
                ],
                answer: 1,
                explanation: "RAM bertugas menyimpan data aplikasi yang sedang aktif berjalan. Jika RAM penuh saat multitasking, sistem akan mengalami *lag* atau bottleneck. Solusi utamanya adalah memperbesar kapasitas RAM."
            },
            {
                id: 3,
                question: "Perhatikan alur kerja sistem komputer saat mengambil foto menggunakan kamera smartphone: (1) Sensor lensa menerima cahaya -> (2) Processor mengolah matriks warna -> (3) Foto tersimpan di galeri. Alur ini mencerminkan prinsip utama sistem komputasi yaitu...",
                options: [
                    "Output - Process - Input",
                    "Input - Process - Output / Storage",
                    "Storage - Input - Process",
                    "Process - Input - Output",
                    "Input - Storage - Output"
                ],
                answer: 1,
                explanation: "Prinsip dasar Von Neumann / Sistem Komputer adalah Input (sensor menerima cahaya) -> Process (processor mengolah warna) -> Output/Storage (foto ditampilkan dan disimpan ke memori)."
            },
            {
                id: 4,
                question: "Manakah di bawah ini yang merupakan contoh penerapan prinsip Interaksi Manusia dan Komputer (HCI) yang baik pada desain antarmuka aplikasi pesan singkat?",
                options: [
                    "Menggunakan ukuran tombol kirim yang sangat kecil agar hemat ruang layar",
                    "Memberikan umpan balik (feedback) visual berupa centang dua saat pesan terkirim",
                    "Sering mengubah tata letak tombol utama tanpa ada pemberitahuan",
                    "Menampilkan teks dalam jumlah sangat padat tanpa kontras warna yang jelas",
                    "Menghilangkan konfirmasi saat pengguna ingin menghapus seluruh riwayat chat"
                ],
                answer: 1,
                explanation: "Prinsip HCI / UX yang baik memberikan *Feedback* (umpan balik) langsung kepada pengguna (seperti ikon centang pesan terkirim) agar pengguna tahu status aksi yang baru mereka lakukan."
            },
            {
                id: 5,
                question: "Sistem Operasi (OS) bertindak sebagai jembatan perantara antara perangkat keras (hardware) dan perangkat lunak aplikasi (software). Manakah yang BUKAN merupakan fungsi utama Sistem Operasi?",
                options: [
                    "Manajemen Memori Utama (RAM)",
                    "Manajemen Berkas dan Penyimpanan",
                    "Manajemen Proses dan Tugas CPU",
                    "Mendesain grafik animasi 3D pada game",
                    "Manajemen Perangkat Input/Output (I/O)"
                ],
                answer: 3,
                explanation: "Mendesain grafik 3D adalah fungsi aplikasi spesifik (seperti Blender/Unreal Engine), bukan tugas inti dari Sistem Operasi. Tugas OS adalah mengelola sumber daya perangkat keras seperti memori, berkas, dan proses."
            },
            {
                id: 6,
                question: "Mengapa BIOS (Basic Input/Output System) disimpan dalam chip ROM (Read Only Memory) dan bukan pada Harddisk atau RAM?",
                options: [
                    "Karena ROM dapat ditulis ulang ribuan kali setiap detik",
                    "Karena ROM bersifat non-volatile sehingga instruksi booting tidak hilang saat komputer dimatikan",
                    "Karena ROM memiliki kapasitas jauh lebih besar dari Harddisk",
                    "Karena ROM berharga lebih murah dibandingkan RAM",
                    "Karena ROM memproses data lebih cepat daripada Cache CPU"
                ],
                answer: 1,
                explanation: "ROM bersifat *non-volatile* (data tidak hilang saat listrik padam). BIOS berisi instruksi awal booting komputer yang wajib ada begitu tombol Power ditekan."
            },
            {
                id: 7,
                question: "Seorang siswa ingin menyambungkan printer baru ke laptopnya yang menggunakan Windows 11. Namun printer tersebut tidak merespons sama sekali saat diperintah mencetak. Software khusus apakah yang kemungkinan belum terinstall?",
                options: [
                    "Operating System Patch",
                    "Device Driver",
                    "Antivirus Software",
                    "Firmware Update Utility",
                    "Database Management System"
                ],
                answer: 1,
                explanation: "Device Driver adalah perangkat lunak perantara khusus yang memungkinkan Sistem Operasi berkomunikasi dan mengenali fungsi perangkat keras luar (seperti printer, scanner, GPU)."
            },
            {
                id: 8,
                question: "Andi mendapati smartphone miliknya terasa sangat panas saat digunakan dan daya baterai cepat habis padahal ia tidak sedang main game. Langkah troubleshooting pertama yang paling efisien berdasarkan analisis Sistem Operasi adalah...",
                options: [
                    "Langsung mereset smartphone ke pengaturan pabrik (Factory Reset)",
                    "Mengecek daftar aplikasi yang berjalan di latar belakang (background processes) dan menutupnya",
                    "Mengganti baterai smartphone dengan yang baru",
                    "Menghapus seluruh foto di folder galeri",
                    "Membeli kartu memori eksternal baru"
                ],
                answer: 1,
                explanation: "Seringkali *background processes* (aplikasi berjalan diam-diam) menguras alokasi daya CPU dan RAM, membuat smartphone panas. Solusi awal adalah mengecek Task Manager/App Manager dan menghentikan proses aplikasi tersembunyi."
            },
            {
                id: 9,
                question: "Dalam konsep arsitektur komputer modern, apakah perbedaan mendasar antara memori Cache CPU dan Storage (SSD/HDD)?",
                options: [
                    "Cache berukuran sangat besar dan lambat, sedangkan SSD sangat kecil dan cepat",
                    "Cache berada sangat dekat dengan inti CPU dengan kecepatan sangat tinggi namun kapasitas terbatas",
                    "Storage menyimpan data sementara saat komputer menyala saja",
                    "Cache bertugas menyimpan file sistem operasi secara permanen",
                    "Tidak ada perbedaan fungsi antar keduanya"
                ],
                answer: 1,
                explanation: "Cache CPU terletak di dalam/sangat dekat inti CPU, dibuat dengan teknologi SRAM sangat cepat untuk menampung instruksi yang sering diproses, sedangkan SSD/HDD adalah media penyimpanan sekunder berkapasitas besar dan permanen."
            },
            {
                id: 10,
                question: "Berdasarkan pendekatan Deep Learning (Meaningful & Joyful Learning), manakah analogi yang PALING TEPAT untuk menggambarkan hubungan antara CPU, RAM, dan Harddisk pada restoran?",
                options: [
                    "CPU = Pelayan, RAM = Koki, Harddisk = Piring saji",
                    "CPU = Koki (Pemroses), RAM = Meja Dapur Potong (Tempat kerja sementara), Harddisk = Gudang Bahan Makanan (Penyimpanan permanen)",
                    "CPU = Gudang, RAM = Buku Menu, Harddisk = Kasir",
                    "CPU = Meja Makan, RAM = Kompor, Harddisk = Wastafel",
                    "CPU = Kasir, RAM = Meja Makan, Harddisk = Pelayan"
                ],
                answer: 1,
                explanation: "Analogi Restoran: CPU adalah Koki yang memasak/mengolah instruksi. RAM adalah Meja Racik Dapur (luas meja menentukan berapa bahan yang bisa disiapkan sekaligus). Harddisk adalah Gudang Bahan Baku di belakang (besar, simpan semua stok permanen)."
            }
        ];

        // --- APP COMPONENT MAIN ---
        function App() {

            const [selectedTopic, setSelectedTopic] = useState(1);
            
            // Simulation States
            const [simInputText, setSimInputText] = useState('SMAN 2 KLARI');
            const [simStage, setSimStage] = useState(0); // 0: Idle, 1: Input, 2: RAM, 3: CPU, 4: Storage/Output
            const [isSimulating, setIsSimulating] = useState(false);

            // Troubleshooting Sim State
            const [selectedIssue, setSelectedIssue] = useState(null);
            const [diagnosticResult, setDiagnosticResult] = useState('');

            // Quiz States
            const [userAnswers, setUserAnswers] = useState({});
            const [showResults, setShowResults] = useState(false);
            const [score, setScore] = useState(0);

            useEffect(() => {
                lucide.createIcons();
            });

            // Start CPU Data Flow Simulation
            const runDataFlowSimulation = () => {
                if(!simInputText) return;
                setIsSimulating(true);
                setSimStage(1); // Input
                
                setTimeout(() => setSimStage(2), 1200); // To RAM
                setTimeout(() => setSimStage(3), 2500); // To CPU (ALU/CU)
                setTimeout(() => setSimStage(4), 3800); // To Output/Storage
                setTimeout(() => {
                    setIsSimulating(false);
                }, 5000);
            };

            // Quiz Handlers
            const handleSelectAnswer = (qIndex, optionIndex) => {
                setUserAnswers({ ...userAnswers, [qIndex]: optionIndex });
            };

            const calculateQuizScore = () => {
                let correctCount = 0;
                quizData.forEach((q, idx) => {
                    if (userAnswers[idx] === q.answer) {
                        correctCount++;
                    }
                });
                setScore(correctCount * 10);
                setShowResults(true);
            };

            const resetQuiz = () => {
                setUserAnswers({});
                setShowResults(false);
                setScore(0);
            };

                            <div className="flex items-center space-x-3">
                                <div className="p-2 bg-indigo-600 rounded-lg">
                                    <i data-lucide="cpu" className="w-6 h-6 text-cyan-300"></i>
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-base sm:text-lg leading-tight tracking-wide">

                                </div>
                            </div>

                                <span className="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-full flex items-center gap-1">
                                    <i data-lucide="sparkles" className="w-3.5 h-3.5"></i> Deep Learning
                                </span>
                                <span className="bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 px-3 py-1 rounded-full">
                                    Kurikulum Merdeka
                                </span>
                            </div>
                        </div>
                    </header>

                    {/* MAIN NAVIGATION TABS */}
                    <nav className="bg-white border-b border-slate-200 shadow-sm sticky top-16 z-40">
                        <div className="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 flex space-x-1 sm:space-x-4 overflow-x-auto custom-scrollbar py-2">
                            <button
                                onClick={() => setActiveTab('analisis')}
                                className={`px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center space-x-2 transition-all whitespace-nowrap ${
                                    activeTab === 'analisis'
                                        ? 'bg-indigo-600 text-white shadow-sm'
                                        : 'text-slate-600 hover:bg-slate-100'
                                }`}
                            >
                                <i data-lucide="file-search" className="w-4 h-4"></i>
                                <span>Analisis Modul & TP</span>
                            </button>

                            <button
                                onClick={() => setActiveTab('materi')}
                                className={`px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center space-x-2 transition-all whitespace-nowrap ${
                                    activeTab === 'materi'
                                        ? 'bg-indigo-600 text-white shadow-sm'
                                        : 'text-slate-600 hover:bg-slate-100'
                                }`}
                            >
                                <i data-lucide="book-open" className="w-4 h-4"></i>
                                <span>Materi & Analogi</span>
                            </button>

                            <button

                            >
                                <i data-lucide="check-square" className="w-4 h-4"></i>

                    {/* CONTENT CONTAINER */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
                        
                        {/* TAB 1: ANALISIS MODUL AJAR */}
                        {activeTab === 'analisis' && (
                            <div className="space-y-6">
                                {/* Banner Info */}

                                            Analisis Modul Ajar Terintegrasi
                                        </div>
                                        <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight">
                                            Perancangan Media Pembelajaran Interaktif (MPI)
                                        </h2>
                                        <p className="text-indigo-200 text-sm sm:text-base max-w-3xl leading-relaxed">
                                            Modul Ajar karya <strong>Topan Sopyan, S.Kom. (SMAN 2 Klari)</strong> berfokus pada pemahaman komprehensif arsitektur komputer, interaksi sistem, OS, dan troubleshooting menggunakan pendekatan <em>Deep Learning</em> (Mindful, Meaningful, & Joyful Learning).

                                {/* Matriks Kesesuaian TP */}
                                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">

                                        Matriks Pemetaan Tujuan Pembelajaran (TP) ke Fitur MPI
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {/* TP 1 */}
                                        <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md border border-indigo-200">Pertemuan 1 (2 JP)</span>
                                                <span className="text-xs text-slate-500">Hardware & CPU</span>
                                            </div>
                                            <h4 className="font-bold text-slate-800 text-sm">Mengenal Perangkat Keras & Otak Komputer</h4>
                                            <p className="text-xs text-slate-600 leading-relaxed">
                                                Mengidentifikasi komponen utama (Input, Process, Output, Storage) dan fungsi CPU (ALU & CU).
                                            </p>
                                            <div className="pt-2 text-xs font-semibold text-emerald-600 flex items-center gap-1">
                                                <i data-lucide="check-circle2" className="w-3.5 h-3.5"></i> Implementasi MPI: Modul Materi Hardware + Simulasi Alur Data

                                                <i data-lucide="check-circle2" className="w-3.5 h-3.5"></i> Implementasi MPI: Uji Komparasi Antarmuka UI/UX
                                            </div>

                                            </div>

                                {/* TOPIC 1: HARDWARE & CPU */}
                                {selectedTopic === 1 && (
                                    <div className="space-y-6">

                                                <h4 className="font-bold text-sm text-slate-800">Analisis "Kenapa HP Sekolah Sering Bikin Kesal?"</h4>
                                                <p className="text-xs text-slate-600 leading-relaxed">
                                                    Lakukan survei kecil di kelas tentang keluhan utama gawai (baterai boros, memori internal penuh, aplikasi sering keluar sendiri). Susun 5 SOP perawatan gawai untuk siswa.
                                                </p>
                                            </div>
                                            <div className="pt-3 border-t text-[11px] font-semibold text-amber-600">
                                                Output: Booklet Digital / Slide Presentasi
                                            </div>
                                        </div>

                                        {/* Proyek 3 */}
                                        <div className="p-5 rounded-2xl border border-slate-200 bg-slate-50 space-y-3 flex flex-col justify-between">
                                            <div className="space-y-2">
                                                <span className="px-2.5 py-1 bg-emerald-100 text-emerald-700 text-[10px] font-extrabold rounded-md uppercase">PROYEK 3</span>
                                                <h4 className="font-bold text-sm text-slate-800">Redesain Interface Aplikasi Berita Ramah Lansia (HCI)</h4>
                                                <p className="text-xs text-slate-600 leading-relaxed">
                                                    Banyak lansia kesulitan membaca tulisan berita di smartphone. Buat sketsa mock-up antarmuka (UI) sederhana yang menerapkan prinsip kontras, teks besar, dan tombol navigasi intuitif.
                                                </p>
                                            </div>
                                            <div className="pt-3 border-t text-[11px] font-semibold text-emerald-600">
                                                Output: Sketsa Desain UI / Prototype Paper
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 5: LATIHAN SOAL (10 SOAL INTERAKTIF) */}
                        {activeTab === 'latihan' && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-6">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4">
                                        <div>
                                            <h3 className="text-xl font-extrabold text-slate-800 flex items-center gap-2">
                                                <i data-lucide="check-square" className="w-6 h-6 text-indigo-600"></i>
                                                Latihan Soal Evaluasi Formatif (10 Soal)
                                            </h3>
                                            <p className="text-xs text-slate-500">Soal dikembangkan sesuai indikator pencapaian Tujuan Pembelajaran Sistem Komputer</p>
                                        </div>

                                        {!showResults ? (
                                            <button
                                                onClick={calculateQuizScore}
                                                disabled={Object.keys(userAnswers).length < quizData.length}
                                                className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold text-xs sm:text-sm rounded-xl transition-all shadow-md flex items-center gap-2"
                                            >
                                                <i data-lucide="send" className="w-4 h-4"></i>
                                                <span>Kirim & Lihat Nilai</span>
                                            </button>
                                        ) : (
                                            <button
                                                onClick={resetQuiz}
                                                className="px-5 py-2.5 bg-slate-700 hover:bg-slate-800 text-white font-bold text-xs sm:text-sm rounded-xl transition-all shadow-md flex items-center gap-2"
                                            >
                                                <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                                                <span>Ulangi Latihan</span>
                                            </button>
                                        )}
                                    </div>

                                    {/* Score Banner */}
                                    {showResults && (
                                        <div className={`p-6 rounded-2xl border flex flex-col sm:flex-row items-center justify-between gap-4 ${
                                            score >= 75 ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-amber-50 border-amber-300 text-amber-900'
                                        }`}>
                                            <div className="space-y-1 text-center sm:text-left">
                                                <h4 className="text-lg font-black">
                                                    {score >= 75 ? '🎉 Luar Biasa! Penguasaan Materi Sangat Baik' : '💪 Tetap Semangat! Pelajari Kembali Pembahasan Soal'}
                                                </h4>
                                                <p className="text-xs opacity-90">
                                                    Anda berhasil menjawab benar {score / 10} dari 10 soal evaluasi.
                                                </p>
                                            </div>
                                            <div className="text-4xl font-black bg-white px-6 py-3 rounded-2xl shadow-inner border border-slate-200">
                                                {score} <span className="text-xs text-slate-500 font-normal">/ 100</span>
                                            </div>
                                        </div>
                                    )}

                                    {/* Questions List */}
                                    <div className="space-y-6">
                                        {quizData.map((q, qIndex) => {
                                            const isSelected = userAnswers[qIndex] !== undefined;
                                            const isCorrect = userAnswers[qIndex] === q.answer;

                                            return (
                                                <div key={q.id} className="p-5 rounded-2xl border border-slate-200 bg-slate-50 space-y-4">
                                                    <div className="flex items-start justify-between gap-3">
                                                        <h4 className="font-bold text-slate-800 text-sm leading-relaxed">
                                                            <span className="text-indigo-600 mr-1">{qIndex + 1}.</span> {q.question}
                                                        </h4>
                                                    </div>

                                                    {/* Options */}
                                                    <div className="space-y-2">
                                                        {q.options.map((opt, optIndex) => {
                                                            let optionStyle = "border-slate-200 bg-white hover:bg-indigo-50/50 text-slate-700";
                                                            
                                                            if (userAnswers[qIndex] === optIndex) {
                                                                optionStyle = "border-indigo-600 bg-indigo-100 text-indigo-900 font-bold";
                                                            }

                                                            if (showResults) {
                                                                if (optIndex === q.answer) {
                                                                    optionStyle = "border-emerald-500 bg-emerald-100 text-emerald-900 font-bold";
                                                                } else if (userAnswers[qIndex] === optIndex && optIndex !== q.answer) {
                                                                    optionStyle = "border-rose-500 bg-rose-100 text-rose-900 line-through";
                                                                }
                                                            }

                                                            return (
                                                                <button
                                                                    key={optIndex}
                                                                    disabled={showResults}
                                                                    onClick={() => handleSelectAnswer(qIndex, optIndex)}
                                                                    className={`w-full text-left p-3 rounded-xl border text-xs transition-all flex items-center justify-between ${optionStyle}`}
                                                                >
                                                                    <span>{String.fromCharCode(65 + optIndex)}. {opt}</span>
                                                                    {userAnswers[qIndex] === optIndex && !showResults && (
                                                                        <i data-lucide="check" className="w-4 h-4 text-indigo-600"></i>
                                                                    )}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>

                                                    {/* Pembahasan */}
                                                    {showResults && (
                                                        <div className="p-4 rounded-xl bg-white border border-slate-200 text-xs text-slate-700 space-y-1">
                                                            <div className="font-bold text-indigo-700 flex items-center gap-1">
                                                                <i data-lucide="info" className="w-3.5 h-3.5"></i> Pembahasan:
                                                            </div>
                                                            <p className="leading-relaxed">{q.explanation}</p>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* FOOTER */}
                    <footer className="bg-slate-900 text-slate-400 border-t border-slate-800 text-xs py-6 mt-12">
                        <div className="max-w-7xl mx-auto px-4 text-center space-y-2">
                            <p className="font-semibold text-slate-300">
                                Media Pembelajaran Interaktif (MPI) Informatika Kelas X - Sistem Komputer
                            </p>
                            <p>
                                Dikembangkan berdasarkan Modul Ajar Bpk. Topan Sopyan, S.Kom. | SMAN 2 Klari (2026/2027)
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
